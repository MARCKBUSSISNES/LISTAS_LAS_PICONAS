<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TRASLADOS LAS PICONAS</title>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

<style>
/* -------------------------
   Diseño moderno (solo CSS)
   -------------------------*/
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes pulseGreen {
  0%,100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(37,211,102,0.25)); }
  50% { transform: scale(1.06); filter: drop-shadow(0 0 12px rgba(37,211,102,0.35)); }
}
@keyframes heartbeat {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

body{
  font-family: 'Poppins', Arial, sans-serif;
  background: #0b0f14 url('FONDO PARA LISTA.jpg') no-repeat center center fixed;
  background-size: cover;
  margin:0;
  color: #e8f5e9;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  animation: fadeIn .6s ease;
}

/* Header */
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 24px;
  background: rgba(0,0,0,0.75);
  box-shadow: 0 6px 20px rgba(0,0,0,0.6);
  position: relative;
}
#logo{
  width:420px;
  height:auto;
  object-fit:contain;
}
header h1{
  flex:1;
  text-align:center;
  margin:0;
  font-size:1.9rem;
  color:#25D366;
  text-shadow: 0 0 8px rgba(37,211,102,0.12);
}
#currentDate{
  position:absolute;
  right:18px;
  top:12px;
  font-family:'Courier New', monospace;
  font-size:1.5rem; /* hora más grande */
  color:#25D366;
  font-weight:700;
  animation: pulseGreen 2.4s infinite;
}

/* Circular countdown under the date */
.countdown-wrap{
  position:absolute;
  right:12px;
  top:58px;
  width:64px;
  height:64px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.countdown-circle{
  width:64px;
  height:64px;
  border-radius:50%;
  background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
  border:2px solid rgba(37,211,102,0.15);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#25D366;
  font-weight:700;
  font-family:'Courier New', monospace;
  box-shadow: 0 6px 16px rgba(0,0,0,0.6);
}

/* Container */
.container{
  max-width:970px;
  margin:22px auto;
  padding:20px;
  background: rgba(0,0,0,0.58);
  border-radius:12px;
  box-shadow:0 10px 40px rgba(0,0,0,0.7);
  animation: fadeIn .6s ease;
}

/* Form group */
.form-group{
  display:flex;
  gap:12px;
  margin-bottom:14px;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
}
select, input{
  padding:12px;
  border-radius:8px;
  border:none;
  font-size:1rem;
  flex:1;
  background: rgba(255,255,255,0.04);
  color: #fff;
  transition: box-shadow .2s ease, transform .06s ease;
}
select:focus, input:focus {
  outline: none;
  box-shadow: 0 6px 18px rgba(37,211,102,0.12);
}

/* Buttons */
button{
  padding:12px 18px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
  font-size:1rem;
  transition: transform .12s ease, box-shadow .12s ease;
}
#addBtn{ background:#25D366; color:#001; }
#addBtn:hover{ transform: translateY(-3px); box-shadow:0 8px 22px rgba(37,211,102,0.18); }
#cleanBtn{
  width:44px; height:44px; border-radius:50%;
  border:2px solid #25D366; background:transparent; color:#25D366;
}
#cleanBtn:hover{ background:#25D366; color:#000; transform: rotate(8deg); box-shadow:0 8px 22px rgba(37,211,102,0.12); }
#generatePDF{ background:#25D366; color:#001; }
#generatePDF:hover{ transform: translateY(-3px); box-shadow:0 8px 22px rgba(37,211,102,0.18); }
#sendJuanBtn{ background:transparent; color:#25D366; border:2px solid #25D366; }
#sendJuanBtn:hover{ background:#25D366; color:#000; transform: translateY(-3px); }

/* Table */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:12px;
  background: rgba(255,255,255,0.02);
  border-radius:10px;
  overflow:hidden;
}
table, th, td{ border-bottom:1px solid rgba(255,255,255,0.04); }
th{
  background: rgba(37,211,102,0.06);
  color:#25D366;
  font-weight:800;
  padding:10px;
}
td{
  padding:10px;
  text-align:center;
  color:#e6f4ea;
}
tbody tr:hover{ background: rgba(37,211,102,0.06); }

/* Delete button inside table */
.table-delete-btn{
  background:#ff5c5c;
  color:white;
  border:none;
  border-radius:6px;
  padding:6px 8px;
  cursor:pointer;
}

/* Saved lists area */
#savedLists{
  margin-top:18px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
#savedLists h3{ width:100%; margin:0 0 6px 0; color:#cde9d1; }

/* Floating LOGOMARCK support button (bottom-right) */
.floating-support{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:9999;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}
.support-btn{
  width:64px;
  height:64px;
  border-radius:50%;
  background: #fff;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow: 0 12px 30px rgba(0,0,0,0.5);
  cursor:default; /* no action on click as requested */
  animation: heartbeat 2s infinite;
  border: 3px solid rgba(0,0,0,0.05);
}
.support-btn img{ width:42px; height:42px; object-fit:contain; display:block; animation: pulseGreen 2.2s infinite; }
.support-label{ font-size:0.85rem; color:#cfeed8; text-shadow:0 2px 6px rgba(0,0,0,0.6); }

/* Small responsiveness */
@media (max-width:720px){
  header h1{ font-size:1.3rem; }
  #logo{ width:260px; }
  #currentDate{ font-size:1.05rem; right:12px; top:8px; }
  .countdown-wrap{ top:44px; right:8px; }
}
</style>
</head>

<body>

<header>
  <img src="LOGO1 (2).png" alt="Logo" id="logo">
  <h1>REGISTRO DE PRODUCTOS PARA TRASLADO</h1>

  <!-- Hora grande -->
  <div id="currentDate"></div>

  <!-- Reloj circular (cuenta regresiva por minuto) -->
  <div class="countdown-wrap" aria-hidden="true">
    <div class="countdown-circle" id="countdownDisplay">60</div>
  </div>
</header>

<div class="container">
  <div class="form-group">
    <input type="text" id="productName" placeholder="Nombre del producto">
    <input type="number" id="productQty" placeholder="Cantidad">
    <input type="text" id="productUnit" placeholder="Unidad de medida">
    <select id="productSupplier">
      <option value="">Proveedor</option>
      <option value="PP">PP</option>
      <option value="AP">AP</option>
      <option value="SC">SC</option>
      <option value="RS">RS</option>
      <option value="TERM">TERM</option>
      <option value="PRC">PRC</option>
    </select>
    <button id="addBtn">Agregar</button>
    <button id="cleanBtn">🗑</button>
  </div>

  <table id="itemsTable" aria-live="polite">
    <thead>
      <tr>
        <th>Producto</th>
        <th>Cantidad</th>
        <th>Unidad</th>
        <th>Proveedor</th>
        <th>Recibido</th>
        <th>Borrar</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="form-group" style="margin-top:18px;">
    <input type="text" id="operator" placeholder="Quién realiza el procedimiento">
    <select id="branch">
      <option value="">Sucursal</option>
      <option value="Roosevelt">Roosevelt</option>
      <option value="SanCristobal">San Cristobal</option>
      <option value="AtlanticPlaza">Atlantic Plaza</option>
    </select>
    <button id="generatePDF">Generar PDF</button>
    <button id="sendJuanBtn">Enviar a Juan Luis</button>
  </div>

  <!-- Saved lists (botones por cada guardado del día) -->
  <div id="savedLists">
    <h3>Listas Guardadas</h3>
    <!-- botones generados dinámicamente -->
  </div>
</div>

<!-- Floating support button (LOGOMARCK) - no acción al click -->
<div class="floating-support" aria-hidden="true">
  <div class="support-btn" title="Soporte">
    <img src="LOGOMARCK.png" alt="LOGOMARCK">
  </div>
  <div class="support-label">Soporte</div>
</div>

<audio id="addSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>

<script>
/* ===========================
   Preservar la lógica original
   + agregar guardado y UI extras
   =========================== */

const items = [];
const tbody = document.querySelector('#itemsTable tbody');
const currentDateEl = document.getElementById('currentDate');
const addSound = document.getElementById('addSound');
const savedListsContainer = document.getElementById('savedLists');
const countdownDisplay = document.getElementById('countdownDisplay');

/* ----- Fecha/hora y contador ----- */
function updateDate(){
  const now = new Date();
  // Mantener el mismo formato usado antes (locale)
  currentDateEl.textContent = now.toLocaleString();
}
updateDate();
setInterval(updateDate, 1000);

/* Countdown por minuto (se reinicia cada minuto) */
let countdownSec = 60;
function startCountdown(){
  // calcular segundos restantes en el minuto actual
  const now = new Date();
  countdownSec = 60 - now.getSeconds();
  countdownDisplay.textContent = countdownSec;
  clearInterval(window._countdownInterval);
  window._countdownInterval = setInterval(()=>{
    countdownSec--;
    if(countdownSec <= 0){
      // reinicia a 60 y espera siguiente minuto
      countdownSec = 60;
    }
    countdownDisplay.textContent = countdownSec;
  }, 1000);
}
startCountdown();
setInterval(startCountdown, 1000 * 30); // re-sincroniza cada 30s por seguridad

/* ----- Render tabla (igual que antes) ----- */
function renderTable(){
  tbody.innerHTML='';
  items.forEach((it,index)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${it.name}</td>
                    <td>${it.qty}</td>
                    <td>${it.unit}</td>
                    <td>${it.supplier}</td>
                    <td>[ ]</td>
                    <td><button class="table-delete-btn" onclick="deleteItem(${index})">❌</button></td>`;
    tbody.appendChild(tr);
  });
}

/* ----- Eliminar item (igual) ----- */
function deleteItem(index){
  items.splice(index,1);
  renderTable();
}

/* Hacer funciones globales (mantener compatibilidad con onclick inline) */
window.deleteItem = deleteItem;

/* ----- Agregar producto (igual) ----- */
document.getElementById('addBtn').addEventListener('click', ()=>{
  const name = document.getElementById('productName').value.trim();
  const qty = document.getElementById('productQty').value;
  const unit = document.getElementById('productUnit').value.trim();
  const supplier = document.getElementById('productSupplier').value;
  if(!name || !qty || !supplier){ alert('Complete todos los campos'); return; }
  items.push({name, qty, unit, supplier});
  renderTable();
  addSound.play();
  document.getElementById('productName').value='';
  document.getElementById('productQty').value='';
  document.getElementById('productUnit').value='';
  document.getElementById('productName').focus();

  // Guardar automáticamente en localStorage al agregar (mantener la lista del día)
  autosaveToday();
});

/* Enter para agregar (igual) */
document.getElementById('productName').addEventListener('keypress', (e)=>{
  if(e.key==='Enter'){ document.getElementById('addBtn').click(); }
});

/* ----- Limpiar lista (igual) ----- */
document.getElementById('cleanBtn').addEventListener('click', ()=>{
  if(confirm("¿Desea limpiar toda la lista?")){
    items.length=0;
    renderTable();
    // actualizar guardado
    autosaveToday();
  }
});

/* =========================
   Guardado local (localStorage)
   - Guardar por día y sucursal
   - Solo permitir cargar/modificar si es del mismo día
   ========================= */

const STORAGE_KEY = "trasladosGuardados";

/* Cargar las listas guardadas en la UI */
function loadSavedLists(){
  // preserva el título y luego agrega botones
  savedListsContainer.innerHTML = "<h3>Listas Guardadas</h3>";
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  // ordenar por fecha más reciente al final
  saved.forEach((list, index)=>{
    const btn = document.createElement("button");
    btn.textContent = `${list.fecha} - ${list.sucursal}`;
    btn.style.background = 'transparent';
    btn.style.color = '#25D366';
    btn.style.border = '1px solid rgba(37,211,102,0.25)';
    btn.style.padding = '8px 12px';
    btn.style.borderRadius = '8px';
    btn.style.cursor = 'pointer';
    btn.onclick = ()=> loadList(index);
    savedListsContainer.appendChild(btn);
  });
}

/* Cargar una lista guardada (solo si es del mismo dia) */
function loadList(index){
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  const selected = saved[index];
  if(!selected) return;
  const today = new Date().toLocaleDateString();
  if(selected.fecha !== today){
    alert("No se puede modificar una lista de un día anterior.");
    return;
  }
  items.length = 0;
  selected.items.forEach(it=> items.push(it));
  renderTable();
  document.getElementById("branch").value = selected.sucursal;
  document.getElementById("operator").value = selected.operador || '';
  alert("Lista cargada correctamente. Puedes seguir agregando productos.");
}

/* Guardar (o reemplazar) la lista del día para la sucursal actual */
function saveTodayListForBranch(branch, operator){
  const now = new Date();
  const today = now.toLocaleDateString();
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  const existingIndex = saved.findIndex(l => l.fecha === today && l.sucursal === branch);
  const newList = { fecha: today, sucursal: branch, operador: operator, items: JSON.parse(JSON.stringify(items)) };
  if(existingIndex >= 0){
    saved[existingIndex] = newList;
  } else {
    saved.push(newList);
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
  loadSavedLists();
}

/* Auto-save convenience: if branch selected, save automatically */
function autosaveToday(){
  const branch = document.getElementById('branch').value;
  const operator = document.getElementById('operator').value.trim();
  if(branch){
    saveTodayListForBranch(branch, operator);
  }
}

/* Cargar listas al iniciar */
loadSavedLists();

/* ---------------------------
   Generar PDF (mejor manejo logo)
   --------------------------- */
document.getElementById('generatePDF').addEventListener('click', ()=>{
  if(items.length===0){ alert('No hay productos'); return; }
  const operator = document.getElementById('operator').value.trim();
  const branch = document.getElementById('branch').value;
  if(!branch){ alert('Seleccione sucursal'); return; }
  if(!operator){ alert('Ingrese quién realiza el procedimiento'); return; }

  // Guardar localmente antes de generar PDF
  const now = new Date();
  const today = now.toLocaleDateString();
  // Guard in localStorage (overwrite same day & branch)
  saveTodayListForBranch(branch, operator);

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:[80, 3000]}); // 80mm ancho

  let y = 10;
  const logoImg = new Image();
  logoImg.src = 'LOGO1 (2).png';

  // Wait for first logo to load (the header logo) before continuing PDF creation
  logoImg.onload = () => {
    try {
      // Add header logo (kept as in original behavior)
      // compute size maintaining aspect ratio so it's not "aplastado"
      const maxWidth = 60; // mm
      const imgRatio = logoImg.naturalWidth / logoImg.naturalHeight;
      const imgW = maxWidth;
      const imgH = maxWidth / imgRatio;
      doc.addImage(logoImg, 'PNG', 10, y, imgW, imgH);
      y += imgH + 2;

    } catch(err){
      // if addImage fails, continue without header logo
      y += 10;
    }

    const now2 = new Date();
    doc.setFontSize(10);
    doc.text(`Sucursal: ${branch}`, 40, y, {align:'center'});
    doc.text(`Fecha: ${now2.toLocaleDateString()} ${now2.toLocaleTimeString()}`,70,10,{align:'right'});
    y += 6;
    doc.text(`Quién realiza: ${operator}`,40,y,{align:'center'});
    y += 6;

    doc.autoTable({
      startY: y,
      theme:'grid',
      head: [['Producto','Cantidad','Unidad','Proveedor','Recibido']],
      body: items.map(it=>[it.name,it.qty,it.unit,it.supplier,'[ ]']),
      styles:{ fontSize:9, cellPadding:1 },
      margin:{left:2,right:2},
      tableWidth: 'auto'
    });

    y = doc.lastAutoTable.finalY + 10;

    // Observaciones
    doc.text('Observaciones:',40,y,{align:'center'}); y+=6;
    for(let i=0;i<3;i++){
      doc.text('______________________________',40,y,{align:'center'});
      y+=8;
    }

    // Firmas
    doc.text('Firma de quien recibe:',40,y,{align:'center'}); y+=6;
    doc.text('______________________________',40,y,{align:'center'}); y+=8;
    doc.text('Nombre de quien recibe:',40,y,{align:'center'}); y+=6;
    doc.text('______________________________',40,y,{align:'center'}); y+=8;
    doc.text('Firma de quien entrega:',40,y,{align:'center'}); y+=6;
    doc.text('______________________________',40,y,{align:'center'}); y+=12;

    // Si/No boxes
    doc.text('Se reciben correctamente todos los productos:',40,y,{align:'center'});
    y+=6;
    doc.rect(20,y,6,6); doc.text('SI',28,y+5);
    doc.rect(45,y,6,6); doc.text('NO',53,y+5);
    y+=12;

    // Now add LOGOMARCK small and signature (ensure logo keeps aspect ratio and is small)
    const logo2 = new Image();
    logo2.src = 'LOGOMARCK.png';
    logo2.onload = () => {
      try {
        // small width in mm for 80mm page
        const maxW = 30; // mm
        const ratio = logo2.naturalWidth / logo2.naturalHeight;
        const w = maxW;
        const h = maxW / ratio;
        // center horizontally on page width ~80mm -> center x = (80/2 - w/2)
        const x = (80 - w) / 2;
        doc.addImage(logo2, 'PNG', x, y, w, h);
        y += h + 6;
      } catch (e){
        y += 4;
      }

      // Firma de texto (solo "Sistema Marck Business © 2025")
      doc.setFontSize(9);
      doc.text('Sistema Marck Business © 2025', 40, y, {align:'center'});
      y += 8;

      // Footer small credit (kept minimal)
      doc.setFontSize(8);
      // (we previously removed "Todos los derechos reservados")

      // Guardar PDF
      const fileName = `Lista_${branch}_${now2.getFullYear()}-${now2.getMonth()+1}-${now2.getDate()}.pdf`;
      doc.save(fileName);

      // Limpiar tabla y sucursal (tal como pediste anteriormente)
      items.length = 0;
      renderTable();
      document.getElementById('branch').value = '';

      // Abrir WhatsApp según sucursal (igual que antes)
      let number='';
      if(branch==='Roosevelt') number='51330598';
      if(branch==='SanCristobal') number='39161962';
      if(branch==='AtlanticPlaza') number='36704724';
      if(number) window.open(`https://wa.me/${number}`,'_blank');

    }; // logo2.onload
  }; // logoImg.onload

  // In case logoImg never loads (network/file issue), set a fallback timeout to still finish PDF after 1.2s
  setTimeout(() => {
    // If PDF already saved by onload, skip; otherwise attempt to finalize with minimal content
    // We check whether items array was already cleared to avoid double-saving
    if(items.length === 0) return;
    // Create a minimal version if logo load stalled: proceed similarly but without images
    const now3 = new Date();
    const doc2 = new jsPDF({unit:'mm', format:[80, 3000]});
    let y2 = 10;
    doc2.setFontSize(10);
    doc2.text(`Sucursal: ${document.getElementById('branch').value}`, 40, y2+6, {align:'center'});
    doc2.text(`Fecha: ${now3.toLocaleDateString()} ${now3.toLocaleTimeString()}`,70,10,{align:'right'});
    y2 += 12;
    doc2.text(`Quién realiza: ${document.getElementById('operator').value}`,40,y2,{align:'center'});
    y2 += 8;
    doc2.autoTable({
      startY: y2,
      theme:'grid',
      head: [['Producto','Cantidad','Unidad','Proveedor','Recibido']],
      body: items.map(it=>[it.name,it.qty,it.unit,it.supplier,'[ ]']),
      styles:{ fontSize:9, cellPadding:1 },
      margin:{left:2,right:2},
      tableWidth: 'auto'
    });
    y2 = doc2.lastAutoTable.finalY + 10;
    doc2.text('Observaciones:',40,y2,{align:'center'}); y2+=6;
    for(let i=0;i<3;i++){ doc2.text('______________________________',40,y2,{align:'center'}); y2+=8; }
    doc2.text('Sistema Marck Business © 2025',40,y2+10,{align:'center'});
    const fileName2 = `Lista_${document.getElementById('branch').value}_${now3.getFullYear()}-${now3.getMonth()+1}-${now3.getDate()}.pdf`;
    doc2.save(fileName2);

    // cleanup
    items.length = 0;
    renderTable();
    document.getElementById('branch').value = '';

    let number='';
    const branchNow = document.getElementById('branch').value;
    if(branchNow==='Roosevelt') number='51330598';
    if(branchNow==='SanCristobal') number='39161962';
    if(branchNow==='AtlanticPlaza') number='36704724';
    if(number) window.open(`https://wa.me/${number}`,'_blank');

  }, 1400);
});

/* ----- Enviar a Juan Luis (igual) ----- */
document.getElementById('sendJuanBtn').addEventListener('click', ()=>{
  window.open('https://wa.me/58140621','_blank');
});

/* ----- Cargar saved lists al iniciar ----- */
loadSavedLists();

/* ----- Hacer LOGOMARCK pulse (CSS already does) - no JS needed ----- */

</script>
</body>
</html>
