<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Productos - Sistema Marck Business</title>
<style>
    body {
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(120deg, #0b1724, #142c47);
        color: white;
        margin: 0;
        padding: 20px;
        animation: fadeIn 1s ease-in;
    }

    h1 {
        text-align: center;
        font-size: 28px;
        margin-bottom: 10px;
        animation: slideDown 1s ease;
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        width: 130px;
        animation: fadeIn 1.2s ease-in;
    }

    .hora {
        font-size: 32px;
        font-weight: bold;
        color: #ffb703;
        animation: pulse 2s infinite;
    }

    table {
        width: 100%;
        margin-top: 20px;
        border-collapse: collapse;
        background: rgba(255,255,255,0.1);
        border-radius: 10px;
        overflow: hidden;
        animation: fadeInUp 0.8s ease;
    }

    th, td {
        border-bottom: 1px solid rgba(255,255,255,0.2);
        padding: 10px;
        text-align: left;
    }

    th {
        background-color: rgba(0,0,0,0.4);
    }

    input, select {
        padding: 10px;
        border-radius: 6px;
        border: none;
        margin-right: 10px;
    }

    .boton {
        background: #ffb703;
        color: #0b1724;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        cursor: pointer;
        font-weight: bold;
        transition: transform 0.2s ease, background 0.3s;
    }

    .boton:hover {
        background: #ffd166;
        transform: scale(1.05);
    }

    @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }
    @keyframes slideDown { from {transform: translateY(-20px); opacity: 0;} to {transform: translateY(0); opacity: 1;} }
    @keyframes fadeInUp { from {transform: translateY(30px); opacity: 0;} to {transform: translateY(0); opacity: 1;} }
    @keyframes pulse {
        0%, 100% { transform: scale(1); color: #ffb703; }
        50% { transform: scale(1.1); color: #ffd166; }
    }
</style>
</head>
<body>

<div class="header">
    <h1>Registro de Productos</h1>
    <div class="hora" id="horaActual"></div>
    <img src="LOGOMARCK.png" alt="Logo" class="logo">
</div>

<div style="margin-top: 20px;">
    <input type="text" id="producto" placeholder="Producto">
    <input type="number" id="cantidad" placeholder="Cantidad" min="1">
    <input type="number" id="precio" placeholder="Precio" min="0">
    <select id="sucursal">
        <option value="">Seleccionar Sucursal</option>
        <option>Centro</option>
        <option>Norte</option>
        <option>Sur</option>
    </select>
    <button class="boton" onclick="agregarProducto()">Agregar</button>
</div>

<table id="tablaProductos">
    <thead>
        <tr>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Precio</th>
            <th>Total</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<div style="text-align:center; margin-top: 20px;">
    <button class="boton" onclick="generarPDF()">Generar PDF</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
    const { jsPDF } = window.jspdf;

    function actualizarHora() {
        const ahora = new Date();
        document.getElementById("horaActual").textContent = 
            ahora.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    setInterval(actualizarHora, 1000);
    actualizarHora();

    function agregarProducto() {
        const producto = document.getElementById("producto").value.trim();
        const cantidad = parseFloat(document.getElementById("cantidad").value);
        const precio = parseFloat(document.getElementById("precio").value);
        if (!producto || !cantidad || !precio) return alert("Completa todos los campos.");

        const tbody = document.querySelector("#tablaProductos tbody");
        const fila = document.createElement("tr");
        const total = cantidad * precio;

        fila.innerHTML = `
            <td>${producto}</td>
            <td>${cantidad}</td>
            <td>Q${precio.toFixed(2)}</td>
            <td>Q${total.toFixed(2)}</td>
        `;
        tbody.appendChild(fila);

        document.getElementById("producto").value = "";
        document.getElementById("cantidad").value = "";
        document.getElementById("precio").value = "";
    }

    async function generarPDF() {
        const sucursal = document.getElementById("sucursal").value;
        if (!sucursal) return alert("Selecciona la sucursal antes de generar el PDF.");

        const doc = new jsPDF();
        const fecha = new Date().toLocaleDateString();
        const hora = new Date().toLocaleTimeString();

        doc.setFontSize(16);
        doc.text("Ticket de Registro de Productos", 20, 20);
        doc.setFontSize(12);
        doc.text(`Sucursal: ${sucursal}`, 20, 30);
        doc.text(`Fecha: ${fecha}  Hora: ${hora}`, 20, 37);

        let y = 50;
        doc.setFontSize(11);
        doc.text("Producto", 20, y);
        doc.text("Cant.", 90, y);
        doc.text("Precio", 130, y);
        doc.text("Total", 170, y);
        y += 8;

        const filas = document.querySelectorAll("#tablaProductos tbody tr");
        if (filas.length === 0) return alert("No hay productos para generar el PDF.");

        let totalGeneral = 0;
        filas.forEach(fila => {
            const celdas = fila.querySelectorAll("td");
            const producto = celdas[0].textContent;
            const cantidad = celdas[1].textContent;
            const precio = celdas[2].textContent;
            const total = celdas[3].textContent;

            doc.text(producto, 20, y);
            doc.text(cantidad, 95, y);
            doc.text(precio, 130, y);
            doc.text(total, 170, y);
            y += 7;

            totalGeneral += parseFloat(total.replace("Q", ""));
        });

        y += 10;
        doc.setFontSize(13);
        doc.text(`Total General: Q${totalGeneral.toFixed(2)}`, 20, y);

        // Logo y firma al final del ticket
        const logo = new Image();
        logo.src = "LOGOMARCK.png";
        logo.onload = () => {
            const finalY = y + 30;
            doc.addImage(logo, "PNG", 80, finalY, 50, 25);
            doc.setFontSize(10);
            doc.text("Sistema Marck Business © 2025 — Todos los derechos reservados", 35, finalY + 35);
            doc.save(`Ticket_${sucursal}_${fecha}.pdf`);

            // Limpiar tabla y sucursal
            document.querySelector("#tablaProductos tbody").innerHTML = "";
            document.getElementById("sucursal").value = "";
        };
    }
</script>
</body>
</html>
