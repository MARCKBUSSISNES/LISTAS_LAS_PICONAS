<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TORTILLAS DE HARIN LAS PICONAS</title>

<!-- Intento de carga local: si faltan, el script más abajo cargará CDN automáticamente -->
<script>
  // Colocamos tags para intentar cargar las librerías locales primero.
  (function(){
    var a = document.createElement('script');
    a.src = 'libs/jspdf.umd.min.js';
    a.async = false;
    document.head.appendChild(a);
    var b = document.createElement('script');
    b.src = 'libs/jspdf.plugin.autotable.min.js';
    b.async = false;
    document.head.appendChild(b);
  })();
</script>

<style>
/* Estilos (versión comprimida para claridad) */
:root{--accent:#25D366}
body{font-family:Arial,Helvetica,sans-serif;background:#0b0f14;color:#e8f5e9;margin:0}
.container{max-width:1120px;margin:24px auto;padding:18px;background:rgba(0,0,0,0.62);border-radius:8px}
.form-group{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button{padding:10px;border-radius:6px;border:none}
#itemsTable{width:100%;margin-top:12px;border-collapse:collapse}
#itemsTable th{background:rgba(37,211,102,0.06);padding:8px;color:var(--accent)}
#itemsTable td{padding:8px;text-align:center}
.table-delete-btn{background:#ff5c5c;color:#fff;border:none;border-radius:6px;padding:6px 8px;cursor:pointer}
h1{color:var(--accent);text-align:center}
.small-muted{font-size:0.85rem;color:#cfead2}
</style>
</head>
<body>
<div class="container">
  <h1>REGISTRO DE PRODUCTOS PARA TRASLADO</h1>

  <div class="form-group">
    <input type="text" id="productName" placeholder="Nombre del producto">
    <input type="number" id="productQty" placeholder="Cantidad" style="width:110px">
    <input type="text" id="productUnit" placeholder="Unidad" style="width:120px">
    <select id="productSupplier" style="width:140px">
      <option value="">Proveedor</option>
      <option value="PP">PP</option>
      <option value="AP">AP</option>
      <option value="SC">SC</option>
    </select>
    <button id="addBtn">Agregar</button>
    <button id="cleanBtn">DEL</button>
  </div>

  <table id="itemsTable" aria-live="polite">
    <thead>
      <tr>
        <th>PRODUCTO</th><th>CANTIDAD</th><th>UNIDAD</th><th>PROVEEDOR</th><th>RECIBIDO</th><th>BORRAR</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="form-group" style="margin-top:12px">
    <input type="text" id="operator" placeholder="Quién realiza el procedimiento" style="min-width:200px">
    <select id="branch">
      <option value="">Sucursal</option>
      <option value="Roosevelt">Roosevelt</option>
      <option value="SanCristobal">San Cristobal</option>
      <option value="AtlanticPlaza">Atlantic Plaza</option>
    </select>
    <button id="generatePDF">Generar PDF</button>
    <button id="sendJuanBtn">Enviar</button>
  </div>

  <div id="savedLists" style="margin-top:14px"><h3>Listas Guardadas</h3></div>
  <div class="small-muted">Nota: si las librerías locales no existen, se cargarán desde CDN automáticamente.</div>
</div>

<!-- Sonidos locales (reemplaza con tus MP3 reales en /sounds) -->
<audio id="addSound" src="sounds/CLICK.mp3" preload="auto"></audio>
<audio id="vozSound" src="sounds/VOZ.mp3" preload="auto"></audio>

<script>
/*
  Manejador robusto para asegurar que jsPDF y autotable estén disponibles.
  - Si las versiones locales no cargaron, cargamos desde CDN (fallback).
  - Después habilitamos la funcionalidad del botón "Generar PDF".
*/

const CDN_JS = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
const CDN_AUTOTABLE = "https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js";

function loadScript(url){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = url;
    s.async = true;
    s.onload = () => resolve(url);
    s.onerror = () => reject(new Error('Error cargando ' + url));
    document.head.appendChild(s);
  });
}

// Comprueba si jsPDF ya está disponible
function hasJsPDF(){
  return !!(window.jspdf && window.jspdf.jsPDF);
}

// Intentar asegurar librerías: si ya cargaron (local), resuelve; si no, carga CDN.
async function ensureLibraries(){
  if(hasJsPDF()) return true;
  // Intenta cargar CDN (fallback)
  try{
    await loadScript(CDN_JS);
    // plugin autotable may attach itself or require loading:
    try{ await loadScript(CDN_AUTOTABLE); }catch(e){ /* ignore */ }
    // give some time for window.jspdf to exist
    if(!hasJsPDF()){
      // sometimes jspdf exposes differently; try to wait a tick
      await new Promise(r=>setTimeout(r, 120));
    }
    return hasJsPDF();
  }catch(err){
    console.error("No se pudo cargar jsPDF/autotable desde CDN:", err);
    return false;
  }
}

/* ===============================
   Aplicación: UI, persistencia, PDF
   =============================== */

const items = [];
const tbody = document.querySelector('#itemsTable tbody');
const STORAGE_KEY = "trasladosGuardados";
const CURRENT_STATE_KEY = "traslado_current_state";

function renderTable(){
  tbody.innerHTML = '';
  items.forEach((it, index) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${escapeHtml(it.name)}</td>
                    <td>${escapeHtml(String(it.qty))}</td>
                    <td>${escapeHtml(it.unit)}</td>
                    <td>${escapeHtml(it.supplier)}</td>
                    <td>[ ]</td>
                    <td><button class="table-delete-btn" onclick="deleteItem(${index})">❌</button></td>`;
    tbody.appendChild(tr);
  });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

window.deleteItem = function(index){
  items.splice(index,1);
  renderTable();
  autosaveToday();
  saveCurrentState();
};

document.getElementById('addBtn').addEventListener('click', ()=>{
  const name = document.getElementById('productName').value.trim();
  const qty = document.getElementById('productQty').value;
  const unit = document.getElementById('productUnit').value.trim();
  const supplier = document.getElementById('productSupplier').value;
  if(!name || !qty || !supplier){ alert('Complete todos los campos'); return; }
  items.push({name, qty, unit, supplier});
  renderTable();
  try{ document.getElementById('addSound').currentTime = 0; document.getElementById('addSound').play(); }catch(e){}
  document.getElementById('productName').value=''; document.getElementById('productQty').value=''; document.getElementById('productUnit').value='';
  autosaveToday();
  saveCurrentState();
});

document.getElementById('cleanBtn').addEventListener('click', ()=>{
  if(confirm("¿Desea limpiar toda la lista?")){
    items.length = 0;
    renderTable();
    autosaveToday();
    saveCurrentState();
  }
});

function loadSavedLists(){
  const container = document.getElementById('savedLists');
  container.innerHTML = '<h3>Listas Guardadas</h3>';
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  saved.forEach((list, idx) => {
    const btn = document.createElement('button');
    btn.textContent = `${list.fecha} - ${list.sucursal}`;
    btn.style.margin = '6px';
    btn.onclick = ()=> loadList(idx);
    container.appendChild(btn);
  });
}

function loadList(index){
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  const selected = saved[index];
  if(!selected) return;
  const today = new Date().toLocaleDateString();
  if(selected.fecha !== today){ alert("No se puede modificar una lista de un día anterior."); return; }
  items.length = 0;
  selected.items.forEach(it => items.push(it));
  renderTable();
  document.getElementById('branch').value = selected.sucursal;
  document.getElementById('operator').value = selected.operador || '';
  saveCurrentState();
  alert('Lista cargada correctamente.');
}

function saveTodayListForBranch(branch, operator){
  const now = new Date();
  const today = now.toLocaleDateString();
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  const existingIndex = saved.findIndex(l => l.fecha === today && l.sucursal === branch);
  const newList = { fecha: today, sucursal: branch, operador: operator, items: JSON.parse(JSON.stringify(items)) };
  if(existingIndex >= 0) saved[existingIndex] = newList; else saved.push(newList);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
  loadSavedLists();
}

function autosaveToday(){
  const branch = document.getElementById('branch').value;
  const operator = document.getElementById('operator').value.trim();
  if(branch) saveTodayListForBranch(branch, operator);
}

function saveCurrentState(){
  try{
    const payload = { items: JSON.parse(JSON.stringify(items)), branch: document.getElementById('branch').value, operator: document.getElementById('operator').value.trim(), lastSavedAt: new Date().toISOString() };
    localStorage.setItem(CURRENT_STATE_KEY, JSON.stringify(payload));
  }catch(e){ console.error('Error guardando estado actual', e); }
}

function loadCurrentState(){
  try{
    const raw = localStorage.getItem(CURRENT_STATE_KEY);
    if(!raw) return false;
    const payload = JSON.parse(raw);
    if(payload && Array.isArray(payload.items)){
      items.length = 0;
      payload.items.forEach(it => items.push(it));
      renderTable();
      if(payload.branch) document.getElementById('branch').value = payload.branch;
      if(payload.operator) document.getElementById('operator').value = payload.operator;
      return true;
    }
  }catch(e){ console.error('Error cargando estado actual', e); }
  return false;
}

/* ===== Generar PDF (utiliza ensureLibraries para fallback) ===== */
async function generatePdfAction(){
  if(items.length === 0){ alert('No hay productos'); return; }
  const operator = document.getElementById('operator').value.trim();
  const branch = document.getElementById('branch').value;
  if(!branch){ alert('Seleccione sucursal'); return; }
  if(!operator){ alert('Ingrese quién realiza el procedimiento'); return; }

  const libsReady = await ensureLibraries();
  if(!libsReady){ alert('No se pudieron cargar las librerías necesarias para generar el PDF. Revisa la consola.'); return; }

  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'mm', format:[80, 3000]});
    let y = 10;
    doc.setFontSize(10);
    doc.text(`Sucursal: ${branch}`, 40, y, {align:'center'}); y += 6;
    doc.text(`Operador: ${operator}`, 40, y, {align:'center'}); y += 8;
    doc.text(`Fecha: ${new Date().toLocaleString()}`, 40, y, {align:'center'}); y += 8;

    doc.autoTable({
      startY: y,
      theme: 'grid',
      head: [['Producto','Cantidad','Unidad','Proveedor','Recibido']],
      body: items.map(it => [it.name, it.qty, it.unit, it.supplier, '[ ]']),
      styles: { fontSize:9, cellPadding:1, lineWidth:0.9, lineColor:[0,0,0] },
      tableLineWidth: 1.2,
      tableLineColor: [0,0,0],
      margin: { left: 2, right: 2 }
    });

    const fileName = `Lista_${branch}_${new Date().getFullYear()}-${new Date().getMonth()+1}-${new Date().getDate()}.pdf`;
    doc.save(fileName);

    // Guardar y limpiar
    saveTodayListForBranch(branch, operator);
    saveCurrentState();

    items.length = 0;
    renderTable();
    document.getElementById('branch').value = '';
    localStorage.removeItem(CURRENT_STATE_KEY);

    // Abrir WhatsApp según sucursal (si aplica)
    let number = '';
    if(branch === 'Roosevelt') number = '51330598';
    if(branch === 'SanCristobal') number = '39161962';
    if(branch === 'AtlanticPlaza') number = '41528992';
    if(number) window.open(`https://wa.me/${number}`, '_blank');
  }catch(err){
    console.error('Error generando PDF:', err);
    alert('Hubo un error generando el PDF. Revisa la consola (F12).');
  }
}

document.getElementById('generatePDF').addEventListener('click', generatePdfAction);

document.getElementById('sendJuanBtn').addEventListener('click', ()=>{ window.open('https://wa.me/58140621','_blank'); });

document.getElementById('deleteAllBtn')?.addEventListener('click', ()=>{
  const key = prompt("POR FAVOR INGRESE LA CLAVE DE ADMINISTRADOR");
  if(key === null) return;
  if(key.trim() === "22782522"){ localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(CURRENT_STATE_KEY); loadSavedLists(); alert("Todas las listas guardadas han sido borradas."); } else alert("Clave incorrecta.");
});

/* Inicialización */
window.addEventListener('DOMContentLoaded', ()=>{
  loadSavedLists();
  loadCurrentState();
});

</script>
</body>
</html>
