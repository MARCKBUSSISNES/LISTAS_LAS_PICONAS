<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TRASLADOS LAS PICONAS</title>

<!-- jsPDF + autoTable -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

<style>
/* =========================
   Estilos generales (oscuro / verde neón)
   ========================= */
:root{
  --bg: #0b0f14;
  --panel: rgba(0,0,0,0.62);
  --accent: #25D366;
  --accent-2: #1ae15e;
  --muted: rgba(255,255,255,0.06);
  --glass: rgba(255,255,255,0.03);
  --white: #e8f5e9;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family: "Poppins", Arial, sans-serif;
  background: var(--bg) url('FONDO PARA LISTA.jpg') center/cover no-repeat fixed;
  color:var(--white);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

/* Header */
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 24px;
  background: rgba(0,0,0,0.78);
  box-shadow: 0 8px 30px rgba(0,0,0,0.65);
  position:relative;
}
#logo{
  width:420px;
  height:auto;
  object-fit:contain;
}
header h1{
  flex:1;
  text-align:center;
  margin:0 12px;
  font-size:1.9rem;
  color:var(--accent);
  text-shadow: 0 0 8px rgba(37,211,102,0.12);
}
#currentDate{
  position:absolute;
  right:140px;
  top:12px;
  font-family:'Courier New', monospace;
  font-size:1.6rem;
  color:var(--accent);
  font-weight:700;
  text-align:right;
}

/* countdown circle position */
.countdown-wrap{
  position:absolute;
  right:18px;
  top:12px;
  width:72px;
  height:72px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* Main panel */
.container{
  max-width:1100px;
  margin:26px auto;
  padding:22px;
  background: var(--panel);
  border-radius:12px;
  box-shadow:0 10px 40px rgba(0,0,0,0.72);
}

/* form-group */
.form-group{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  margin-bottom:14px;
}
input[type="text"], input[type="number"], select{
  padding:12px;
  border-radius:8px;
  border:none;
  font-size:1rem;
  flex:1;
  min-width:160px;
  background: var(--glass);
  color:var(--white);
  transition: box-shadow .18s ease;
}
input[type="number"]{ width:110px; }

/* buttons */
button{
  padding:12px 16px;
  border-radius:8px;
  border:none;
  font-weight:700;
  cursor:pointer;
  transition: transform .12s ease, box-shadow .12s ease;
}
#addBtn{ background:var(--accent); color:#000; }
#addBtn:hover{ transform:translateY(-3px); box-shadow:0 10px 30px rgba(37,211,102,0.12); }
#cleanBtn{
  width:46px; height:46px; border-radius:50%;
  border:2px solid var(--accent); background:transparent; color:var(--accent);
}
#cleanBtn:hover{ background:var(--accent); color:#000; transform:rotate(8deg); }

/* Table */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:12px;
  background: rgba(255,255,255,0.02);
  border-radius:8px;
  overflow:hidden;
  box-shadow: inset 0 -1px 0 rgba(255,255,255,0.02);
}
th, td{
  padding:10px;
  text-align:center;
  font-size:1rem;
  border-bottom:1px solid rgba(255,255,255,0.04);
}
th{
  background: rgba(37,211,102,0.05);
  color:var(--accent);
  font-weight:800;
}
tbody tr:hover{ background: rgba(37,211,102,0.06); }

/* delete button in table */
.table-delete-btn{
  background:#ff4d4d;color:#fff;border:none;border-radius:6px;padding:6px 8px;cursor:pointer;
}

/* saved lists */
#savedLists{ margin-top:18px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
#savedLists h3{ width:100%; margin:0 0 8px 0; color:#cfefd2 }

/* floating support (right, no bg, clickable to whatsapp) */
.floating-support{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:9999;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}
.support-btn{
  width:64px;height:64px;border-radius:50%;background:transparent;border:2px solid rgba(255,255,255,0.06);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  animation: heartbeat 1.9s infinite;
}
.support-btn img{ width:44px;height:44px;object-fit:contain; display:block; }
.support-label{ color:#cfeed8;font-size:0.85rem; }

/* floating delete-all left */
.floating-delete{
  position:fixed;
  left:18px;
  bottom:18px;
  z-index:9999;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}
.delete-btn{
  width:64px;height:64px;border-radius:50%;background:transparent;border:2px solid rgba(255,255,255,0.06);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--accent);font-weight:700;
}
.delete-label{ color:#f7c6c6;font-size:0.85rem; }

/* countdown svg text styling */
.countdown-text { font-family: 'Courier New', monospace; font-weight:700; fill: var(--accent); }

/* responsive */
@media (max-width:920px){
  header h1{ font-size:1.3rem; }
  #logo{ width:260px; }
  #currentDate{ font-size:1.05rem; right:100px; top:8px; }
  .container{ margin:12px; padding:12px; }
}
@keyframes heartbeat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <img src="LOGO1 (2).png" id="logo" alt="Logo"/>
  <h1>REGISTRO DE PRODUCTOS PARA TRASLADO</h1>

  <!-- hora grande -->
  <div id="currentDate"></div>

  <!-- countdown circle -->
  <div class="countdown-wrap" aria-hidden="true">
    <svg viewBox="0 0 100 100" width="72" height="72">
      <defs>
        <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#25D366" />
          <stop offset="100%" stop-color="#1ae15e" />
        </linearGradient>
      </defs>
      <circle cx="50" cy="50" r="44" stroke="rgba(255,255,255,0.04)" stroke-width="8" fill="none"></circle>
      <circle id="progressCircle" cx="50" cy="50" r="44" stroke="url(#g1)" stroke-width="8" stroke-linecap="round" fill="none" transform="rotate(-90 50 50)"></circle>
      <text id="countdownText" x="50" y="56" text-anchor="middle" class="countdown-text" font-size="18">60</text>
    </svg>
  </div>
</header>

<!-- MAIN -->
<div class="container">

  <div class="form-group">
    <input type="text" id="productName" placeholder="Nombre del producto">
    <input type="number" id="productQty" placeholder="Cantidad">
    <input type="text" id="productUnit" placeholder="Unidad de medida">
    <select id="productSupplier">
      <option value="">Proveedor</option>
      <option value="PP">PP</option>
      <option value="AP">AP</option>
      <option value="SC">SC</option>
      <option value="RS">RS</option>
      <option value="TERM">TERM</option>
      <option value="PRC">PRC</option>
    </select>

    <button id="addBtn">Agregar</button>
    <button id="cleanBtn" title="Limpiar factura">🗑</button>
  </div>

  <table id="itemsTable" aria-live="polite">
    <thead>
      <tr>
        <th>Producto</th>
        <th>Cantidad</th>
        <th>Unidad</th>
        <th>Proveedor</th>
        <th>Recibido</th>
        <th>Borrar</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="form-group" style="margin-top:18px;">
    <input type="text" id="operator" placeholder="Quién realiza el procedimiento">
    <select id="branch">
      <option value="">Sucursal</option>
      <option value="Roosevelt">Roosevelt</option>
      <option value="SanCristobal">San Cristobal</option>
      <option value="AtlanticPlaza">Atlantic Plaza</option>
    </select>
    <button id="generatePDF">Generar PDF</button>
    <button id="sendJuanBtn">Enviar a Juan Luis</button>
  </div>

  <div id="savedLists">
    <h3>Listas Guardadas</h3>
    <!-- botones dinámicos -->
  </div>

</div>

<!-- floating support (opens WhatsApp) -->
<div class="floating-support" aria-hidden="false">
  <div class="support-btn" id="supportBtn" title="Soporte">
    <img src="LOGOMARCK.png" alt="LOGOMARCK">
  </div>
  <div class="support-label">Soporte</div>
</div>

<!-- floating delete-all -->
<div class="floating-delete" aria-hidden="true">
  <div class="delete-btn" id="deleteAllBtn" title="Borrar todo">🗑</div>
  <div class="delete-label">Borrar todo</div>
</div>

<!-- sound -->
<audio id="addSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>

<script>
/* ===========================
   Código completo y consolidado
   Mantiene TODA la lógica original
   + mejoras solicitadas
   =========================== */

const STORAGE_KEY = "trasladosGuardados";

const items = [];
const tbody = document.querySelector('#itemsTable tbody');
const currentDateEl = document.getElementById('currentDate');
const addSound = document.getElementById('addSound');
const savedListsContainer = document.getElementById('savedLists');

const countdownText = document.getElementById('countdownText');
const progressCircle = document.getElementById('progressCircle');
const CIRCLE_R = 44;
const CIRCLE_C = 2 * Math.PI * CIRCLE_R;
progressCircle.style.strokeDasharray = `${CIRCLE_C}`;
progressCircle.style.strokeDashoffset = `0`;

/* --------------------------
   Fecha / Hora / Countdown
   -------------------------- */
function updateDate(){
  const now = new Date();
  currentDateEl.textContent = now.toLocaleString();
}
updateDate();
setInterval(updateDate, 1000);

let countdownSec = 60;
function syncAndStartCountdown(){
  const now = new Date();
  countdownSec = 60 - now.getSeconds();
  if(countdownSec === 0) countdownSec = 60;
  updateCountdownUI(countdownSec);
  clearInterval(window._countdownInterval);
  window._countdownInterval = setInterval(()=>{
    countdownSec--;
    if(countdownSec <= 0) countdownSec = 60;
    updateCountdownUI(countdownSec);
  }, 1000);
}
function updateCountdownUI(sec){
  countdownText.textContent = sec;
  const progress = sec / 60;
  const dash = CIRCLE_C * (1 - progress);
  progressCircle.style.strokeDashoffset = `${dash}`;
}
syncAndStartCountdown();
setInterval(syncAndStartCountdown, 30000);

/* --------------------------
   Render tabla / CRUD items
   -------------------------- */
function renderTable(){
  tbody.innerHTML = '';
  items.forEach((it, index)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${escapeHtml(it.name)}</td>
                    <td>${escapeHtml(it.qty)}</td>
                    <td>${escapeHtml(it.unit)}</td>
                    <td>${escapeHtml(it.supplier)}</td>
                    <td></td>
                    <td><button class="table-delete-btn" onclick="deleteItem(${index})">❌</button></td>`;
    tbody.appendChild(tr);
  });
}

/* Escapar HTML para seguridad básica */
function escapeHtml(s){
  if(typeof s !== 'string' && typeof s !== 'number') return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* delete item */
function deleteItem(index){
  items.splice(index,1);
  renderTable();
  autosaveToday();
}
window.deleteItem = deleteItem; // para onclick inline

/* agregar producto */
document.getElementById('addBtn').addEventListener('click', ()=>{
  const name = document.getElementById('productName').value.trim();
  const qty = document.getElementById('productQty').value;
  const unit = document.getElementById('productUnit').value.trim();
  const supplier = document.getElementById('productSupplier').value;
  if(!name || !qty || !supplier){ alert('Complete todos los campos'); return; }
  items.push({name, qty, unit, supplier});
  renderTable();
  addSound.play();
  document.getElementById('productName').value='';
  document.getElementById('productQty').value='';
  document.getElementById('productUnit').value='';
  document.getElementById('productName').focus();

  autosaveToday();
});

/* Enter para agregar */
document.getElementById('productName').addEventListener('keypress', (e)=>{
  if(e.key === 'Enter') document.getElementById('addBtn').click();
});

/* clean button */
document.getElementById('cleanBtn').addEventListener('click', ()=>{
  if(confirm("¿Desea limpiar toda la lista?")){
    items.length = 0;
    renderTable();
    autosaveToday();
  }
});

/* --------------------------
   Guardado local (por día)
   -------------------------- */
function loadSavedLists(){
  savedListsContainer.innerHTML = "<h3>Listas Guardadas</h3>";
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  saved.forEach((list, index)=>{
    const btn = document.createElement("button");
    btn.textContent = `${list.fecha} - ${list.sucursal}`;
    btn.style.background = 'transparent';
    btn.style.color = 'var(--accent)';
    btn.style.border = '1px solid rgba(37,211,102,0.18)';
    btn.style.padding = '8px 12px';
    btn.style.borderRadius = '8px';
    btn.style.cursor = 'pointer';
    btn.onclick = ()=> loadList(index);
    savedListsContainer.appendChild(btn);
  });
}

/* cargar una lista (solo del mismo día) */
function loadList(index){
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  const selected = saved[index];
  if(!selected) return;
  const today = new Date().toLocaleDateString();
  if(selected.fecha !== today){
    alert("No se puede modificar una lista de un día anterior.");
    return;
  }
  items.length = 0;
  selected.items.forEach(it => items.push(it));
  renderTable();
  document.getElementById("branch").value = selected.sucursal;
  document.getElementById("operator").value = selected.operador || '';
  alert("Lista cargada correctamente. Puedes seguir agregando productos.");
}

/* guardar lista del día para sucursal */
function saveTodayListForBranch(branch, operator){
  const now = new Date();
  const today = now.toLocaleDateString();
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  const existingIndex = saved.findIndex(l => l.fecha === today && l.sucursal === branch);
  const newList = { fecha: today, sucursal: branch, operador: operator, items: JSON.parse(JSON.stringify(items)) };
  if(existingIndex >= 0){
    saved[existingIndex] = newList;
  } else {
    saved.push(newList);
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
  loadSavedLists();
}

/* autosave convenience */
function autosaveToday(){
  const branch = document.getElementById('branch').value;
  const operator = document.getElementById('operator').value.trim();
  if(branch) saveTodayListForBranch(branch, operator);
}

/* cargar guardados al iniciar */
loadSavedLists();

/* --------------------------
   Generar PDF (modificado según solicitudes)
   - blanco y negro
   - líneas más gruesas
   - columna Recibido vacía
   - fecha y hora separados y alineados a la izquierda debajo del logo
   - LOGOMARCK al final pequeño y proporcional
   - firmas más largas
   - ajustar altura final para que la impresión solo ocupe datos
   -------------------------- */
document.getElementById('generatePDF').addEventListener('click', ()=>{
  if(items.length === 0){ alert('No hay productos'); return; }
  const operator = document.getElementById('operator').value.trim();
  const branch = document.getElementById('branch').value;
  if(!branch){ alert('Seleccione sucursal'); return; }
  if(!operator){ alert('Ingrese quién realiza el procedimiento'); return; }

  // guardar antes
  saveTodayListForBranch(branch, operator);

  const { jsPDF } = window.jspdf;
  // Creamos PDF amplio en altura y luego reducimos con internal page size hack
  const doc = new jsPDF({unit:'mm', format:[80, 3000]}); // 80mm ancho
  let y = 6;
  const marginLeft = 6;

  // Header logo (mantener proporción)
  const logoImg = new Image();
  logoImg.src = 'LOGO1 (2).png';
  logoImg.onload = () => {
    try {
      const maxWidth = 60; // mm permitidos
      const ratio = (logoImg.naturalWidth && logoImg.naturalHeight) ? (logoImg.naturalWidth / logoImg.naturalHeight) : 1;
      const w = Math.min(maxWidth, 60);
      const h = w / ratio;
      doc.addImage(logoImg, 'PNG', marginLeft, y, w, h);
      y += h + 2;
    } catch(e){
      y += 8;
    }

    // Fecha y Hora por separado, alineados a la izquierda
    const now = new Date();
    doc.setFontSize(9);
    doc.setTextColor(0,0,0); // negro
    doc.text(`Fecha: ${now.toLocaleDateString()}`, marginLeft, y);
    y += 5;
    doc.text(`Hora: ${now.toLocaleTimeString()}`, marginLeft, y);
    y += 6;

    // Quién realiza y sucursal (alineado izquierda)
    doc.text(`Quién realiza: ${operator}`, marginLeft, y);
    y += 5;
    doc.text(`Sucursal destino: ${branch}`, marginLeft, y);
    y += 8;

    // autoTable - tabla en B/N con líneas más gruesas
    // autoTable head/body arrays
    const head = [['Producto','Cantidad','Unidad','Proveedor','Recibido']];
    const body = items.map(it => [it.name, it.qty, it.unit, it.supplier, '']); // recibo vacío

    doc.autoTable({
      startY: y,
      head: head,
      body: body,
      theme: 'grid',
      styles: {
        fontSize: 9,
        textColor: 0,
        halign: 'center',
        valign: 'middle',
        cellPadding: 2,
        lineColor: 0,
        lineWidth: 0.6 // líneas más gruesas
      },
      headStyles: {
        fillColor: [255,255,255],
        textColor: 0,
        halign: 'center',
        fontStyle: 'bold',
        lineWidth: 0.8
      },
      margin: { left: marginLeft, right: 2 },
      tableLineColor: [0,0,0],
      tableLineWidth: 0.6,
      didDrawCell: function(data) {
        // nada extra — kept minimal
      }
    });

    y = doc.lastAutoTable ? doc.lastAutoTable.finalY + 6 : y + 10;

    // Observaciones (alineadas izquierda)
    doc.setFontSize(9);
    doc.text('Observaciones:', marginLeft, y);
    y += 6;
    for(let i=0;i<3;i++){
      // line larga (más ancha)
      doc.text('______________________________________________________________', marginLeft, y);
      y += 7;
    }
    y += 2;

    // Firmas (más largas)
    doc.text('Firma de quien recibe:', marginLeft, y); y += 6;
    doc.text('______________________________________________________________', marginLeft, y); y += 8;
    doc.text('Nombre de quien recibe:', marginLeft, y); y += 6;
    doc.text('______________________________________________________________', marginLeft, y); y += 8;
    doc.text('Firma de quien entrega:', marginLeft, y); y += 6;
    doc.text('______________________________________________________________', marginLeft, y); y += 12;

    // SI/NO desactivados (dejamos cajas vacías, pero en B/N)
    doc.text('Se reciben correctamente todos los productos:', marginLeft, y); y += 6;
    doc.rect(marginLeft + 8, y, 6, 6); doc.text('SI', marginLeft + 18, y + 5);
    doc.rect(marginLeft + 36, y, 6, 6); doc.text('NO', marginLeft + 46, y + 5);
    y += 12;

    // LOGOMARCK pequeño al final, centrado
    const logo2 = new Image();
    logo2.src = 'LOGOMARCK.png';
    logo2.onload = () => {
      try {
        const maxW = 30; // mm
        const ratio2 = (logo2.naturalWidth && logo2.naturalHeight) ? (logo2.naturalWidth / logo2.naturalHeight) : 1;
        const w2 = maxW;
        const h2 = w2 / ratio2;
        const x2 = (80 - w2) / 2;
        doc.addImage(logo2, 'PNG', x2, y, w2, h2);
        y += h2 + 6;
      } catch(e){
        y += 6;
      }

      // Firma final (sin "Todos los derechos reservados")
      doc.setFontSize(9);
      doc.text('Sistema Marck Business © 2025', 40, y, { align: 'center' });
      y += 8;

      // Ajuste de "altura de página" para impresión: acortar altura usando internal.pageSize
      try {
        // Establecemos la altura interna para que la impresión solo ocupe hasta y + margen
        const finalHeight = Math.ceil(y + 12); // mm
        if(finalHeight > 0){
          // Hack: cambiar internal page size (funciona)
          doc.internal.pageSize.height = finalHeight;
          // También set height property si existe
          if(doc.internal && doc.internal.pageSize) doc.internal.pageSize.h = finalHeight;
        }
      } catch(e){
        // ignore
      }

      // Guardar archivo con nombre
      const now2 = new Date();
      const fileName = `Lista_${branch}_${now2.getFullYear()}-${now2.getMonth()+1}-${now2.getDate()}.pdf`;
      doc.save(fileName);

      // Limpiar tabla y sucursal (según petición previa)
      items.length = 0;
      renderTable();
      document.getElementById('branch').value = '';

      // Abrir WhatsApp según sucursal (igual que antes)
      let number = '';
      if(branch === 'Roosevelt') number = '51330598';
      if(branch === 'SanCristobal') number = '39161962';
      if(branch === 'AtlanticPlaza') number = '36704724';
      if(number) window.open(`https://wa.me/${number}`,'_blank');
    };

  }; // logoImg.onload

  // fallback timeout if images stall
  setTimeout(() => {
    if(items.length === 0) return;
    // build minimal fallback doc without images
    const { jsPDF } = window.jspdf;
    const doc2 = new jsPDF({unit:'mm', format:[80,3000]});
    let y2 = 10;
    doc2.setFontSize(9);
    doc2.text(`Sucursal: ${document.getElementById('branch').value}`, 6, y2+6);
    doc2.text(`Fecha: ${new Date().toLocaleDateString()}`, 6, y2+12);
    doc2.text(`Hora: ${new Date().toLocaleTimeString()}`, 6, y2+18);
    y2 += 24;
    doc2.autoTable({
      startY: y2,
      head: [['Producto','Cantidad','Unidad','Proveedor','Recibido']],
      body: items.map(it=>[it.name,it.qty,it.unit,it.supplier,'']),
      styles:{ fontSize:9, lineWidth:0.6 },
      margin:{left:6,right:2},
      tableWidth: 'auto'
    });
    y2 = doc2.lastAutoTable.finalY + 6;
    doc2.text('Sistema Marck Business © 2025', 40, y2 + 20, {align:'center'});
    // shorten
    doc2.internal.pageSize.height = Math.ceil(y2 + 30);
    doc2.save(`Lista_${document.getElementById('branch').value}_${new Date().getFullYear()}-${new Date().getMonth()+1}-${new Date().getDate()}.pdf`);
    items.length = 0; renderTable(); document.getElementById('branch').value = '';
  }, 1600);
});

/* --------------------------
   Enviar a Juan Luis (botón)
   - Mantiene comportamiento original: guarda y abre ventana de WhatsApp
   -------------------------- */
document.getElementById('sendJuanBtn').addEventListener('click', ()=>{
  if(items.length === 0){ alert('No hay productos para enviar.'); return; }
